[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-agentic-os"
version = "3.0.0"
description = "Nova - a local-first agentic operating system that lives in the terminal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
rich = ["rich>=13"]
system = ["psutil>=5.9"]
voice = ["edge-tts>=6.1", "pyttsx3>=2.90", "openai-whisper>=20231117", "sounddevice>=0.4"]
dev = ["pytest>=7"]

[project.scripts]
nova = "nova.cli.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["nova*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
