# Render Blueprint for Nova - one Docker web service on the $0 plan.
#
# `free` is 0.1 CPU / 512 MB, which cannot hold a GGUF: llama.cpp needs the weights resident in
# RAM before it answers anything (1B Q4 ~0.8 GB, 4B Q4 ~2.5 GB), and Render's filesystem is
# ephemeral, so every spin-down would re-download them anyway. So on free the brain lives
# outside the container: NOVA_GGUF stays empty and Nova falls through to a hosted key.
#
# To ship the GGUF instead, change `plan` to 2c-4g ($85/mo - 1c-2g at $25/mo works with a 1B
# model) and set NOVA_GGUF to a Hugging Face repo:QUANT like
#   unsloth/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M
# Render has no GPU instances, so that is CPU inference either way.

services:
  - type: web
    name: nova-agent-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free # spins down after 15 idle minutes; the next request waits ~1 min for spin-up
    region: oregon
    # Reports configuration, never model liveness - a /health that fails because a model is
    # slow gets the instance recycled by the platform.
    healthCheckPath: /health
    envVars:
      - key: NOVA_API_TOKEN
        generateValue: true # `nova serve` refuses to bind a public address without a token
      - key: NOVA_GGUF
        value: "" # no in-container model on the free plan
      # sync: false -> Render asks for the value once, in the dashboard, and keeps it out of
      # this file. Adding these later needs the dashboard, not a Blueprint update.
      # Nova tries engines in priority order (llama, ollama, hf, groq, gemini, openai); with
      # NOVA_GGUF empty the first two fail fast, so whichever key you fill in is what answers.
      # Fill in one, not both. A Hugging Face token is not enough - free HF accounts hold no
      # Inference Providers credit.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
